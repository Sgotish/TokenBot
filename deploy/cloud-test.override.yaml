# Small, private two-account trial. No commercial billing in this instance.
services:
  gateway:
    mem_limit: 384m
    environment:
      RUN_MODE: simple
      SIMPLE_MODE_AUTO_CREATE_DEFAULT_GROUPS: "false"
      SIMPLE_MODE_KEY_RATE_LIMIT_ENABLED: "false"
      GOMEMLIMIT: 256MiB
      GOMAXPROCS: "1"
      DATABASE_MAX_OPEN_CONNS: "10"
      DATABASE_MAX_IDLE_CONNS: "2"
      REDIS_POOL_SIZE: "16"
      REDIS_MIN_IDLE_CONNS: "2"
  postgres:
    mem_limit: 192m
    command: ["postgres", "-c", "max_connections=30", "-c", "shared_buffers=32MB", "-c", "work_mem=2MB", "-c", "maintenance_work_mem=32MB"]
  redis:
    mem_limit: 96m
    command: ["sh", "-c", 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD" --maxmemory 48mb --maxmemory-policy noeviction']
