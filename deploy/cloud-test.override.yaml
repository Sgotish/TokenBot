# Small shared pilot; monitor capacity before increasing customer traffic.
services:
  gateway:
    mem_limit: 384m
    environment:
      RUN_MODE: standard
      GOMEMLIMIT: 256MiB
      GOMAXPROCS: "1"
      DATABASE_MAX_OPEN_CONNS: "10"
      DATABASE_MAX_IDLE_CONNS: "2"
      REDIS_POOL_SIZE: "16"
      REDIS_MIN_IDLE_CONNS: "2"
  postgres:
    mem_limit: 192m
    command: ["postgres", "-c", "max_connections=30", "-c", "shared_buffers=32MB", "-c", "work_mem=2MB", "-c", "maintenance_work_mem=32MB"]
  redis:
    mem_limit: 160m
    command: ["sh", "-c", 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD" --maxmemory 96mb --maxmemory-policy noeviction']
