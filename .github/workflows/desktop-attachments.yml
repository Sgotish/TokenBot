name: Windows desktop and attachments
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/desktop-attachments.yml"
      - "integrations/windows-codex/browser-tools/desktop.*"
      - "tests/windows-desktop-smoke.cjs"
jobs:
  desktop:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --omit=dev
        working-directory: integrations/windows-codex/browser-tools
      - run: node --test tests/browser-tools.test.cjs
      - run: node tests/windows-desktop-smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-acceptance
          path: reports/windows-desktop-*
