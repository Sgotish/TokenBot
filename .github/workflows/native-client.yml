name: native client runtime
on: workflow_dispatch
jobs:
  windows-client:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Download official release
        shell: powershell
        run: |
          curl.exe --fail --location --silent --show-error --max-time 240 https://persistent.oaistatic.com/codex-app-prod/ChatGPT-x64.msix -o "$env:RUNNER_TEMP\ChatGPT.msix"
          if ($LASTEXITCODE -ne 0) { throw 'Download failed' }
      - name: Prepare isolated latest client
        shell: powershell
        run: |
          $output = @(& ./integrations/windows-codex/native-menu/install.ps1 -PrepareOnly -ArchivePath "$env:RUNNER_TEMP\ChatGPT.msix")
          $appDirectory = $output[-1]
          "TB_APP_DIR=$appDirectory" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Launch actual Windows application
        shell: powershell
        run: ./tests/windows-native-runtime.ps1 -AppDirectory $env:TB_APP_DIR
      - name: Save diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-client-runtime
          path: |
            reports/native-*
            ~/AppData/Local/TokenBots/Codex-custom-profile/logs/**
          if-no-files-found: warn
