name: Windows installer repair acceptance
on:
  workflow_dispatch:
  push:
    branches: [codex/windows-installer-repair-20261121]
jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Native cmd paths and interrupted downloads (PowerShell 5.1)
        shell: powershell
        run: python -m unittest discover -s tests -p test_windows_installer.py -v
      - name: Prepare pinned official package using repaired installer
        shell: powershell
        run: |
          $output = @(& ./integrations/windows-codex/native-menu/install.ps1 -PrepareOnly)
          if ($LASTEXITCODE -ne 0) { throw 'Preparation failed' }
          $appDirectory = $output[-1]
          "TB_APP_DIR=$appDirectory" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Launch actual desktop with synthetic usage
        shell: powershell
        run: ./tests/windows-native-runtime.ps1 -AppDirectory $env:TB_APP_DIR
      - name: Build public repair files
        run: python scripts/build_windows_installer_repair.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-installer-acceptance
          path: |
            reports/native-*
            delivery/TokenBots-Windows-Installer-Repair-*
