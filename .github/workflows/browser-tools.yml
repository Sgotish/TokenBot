name: Windows browser tools acceptance
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/browser-tools.yml'
      - 'integrations/windows-codex/browser-tools/**'
      - 'tests/browser-tools*'
      - 'tests/windows-browser-install.ps1'
      - 'tests/windows-browser-ota.ps1'
      - 'tests/windows-ota*'
      - 'tests/fixtures/browser-ota*'
      - 'integrations/windows-codex/native-menu/ota-client.cjs'
jobs:
  browser:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --omit=dev
        working-directory: integrations/windows-codex/browser-tools
      - run: node --test tests/browser-tools.test.cjs
      - run: node --test tests/windows-ota.test.cjs
      - name: Windows PowerShell installer and actual Edge MCP click
        shell: powershell
        run: ./tests/windows-browser-install.ps1
      - name: Legacy signed OTA, rollback, real HTTPS download and actual Edge
        shell: powershell
        run: ./tests/windows-browser-ota.ps1
