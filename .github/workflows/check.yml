name: pilot checks
on: [push, pull_request]
jobs:
  cross-platform-client:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
        working-directory: integrations/codex-client
      - run: npm install --global --ignore-scripts @openai/codex@0.163.0
      - run: npm run build
        working-directory: integrations/codex-client
      - run: npm test
        working-directory: integrations/codex-client
        env:
          RUN_CODEX_SMOKE: '1'
  windows-inspection:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check read-only desktop installation inspector
        shell: powershell
        run: ./tests/windows-native-inspection.ps1
      - name: Check independent customer configuration and updates
        shell: powershell
        run: ./tests/windows-customer-setup.ps1
  operations:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r integrations/windows-codex/gateway-requirements.txt "pytest>=8,<10"
      - run: python -m pytest -q tests
      - run: node --test tests/native-backend.test.cjs tests/native-component.test.cjs
      - run: python scripts/init_env.py --admin-email admin@example.com
      - run: docker compose --env-file .env -f deploy/compose.yaml config --quiet
      - run: docker compose --env-file .env -f deploy/compose.yaml -f deploy/cloud-test.override.yaml config --quiet
